<script>/* The only full-size JS download buffer is the current independent pack (<=24 MiB).
   It is released after copyToFS, before fetching the next pack. No join/preloader array. */
window.mqSilent = new URLSearchParams(location.search).has("silent");
window.mqMetrics = {samples: [], marks: [], longTasks: [], userAgent:navigator.userAgent, runId:Date.now(), startedAt: performance.now()};
window.mqMark = function(mark) {
    mark.browserMs = performance.now();
    window.mqMetrics.marks.push(mark);
    console.info('MQ_METRIC', JSON.stringify(mark));
    if(['127.0.0.1','localhost'].includes(location.hostname) && new URLSearchParams(location.search).has('diagnostics')) {
        fetch('/__metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window.mqMetrics)}).catch(()=>{});
    }
};
try {
    new PerformanceObserver(list => {
        for (const e of list.getEntries()) window.mqMetrics.longTasks.push({start:e.startTime,duration:e.duration});
    }).observe({type:'longtask', buffered:true});
} catch (_) {}
window.mqSample = function(engine) {
    const heap = performance.memory;
    const sample = {ms:performance.now(), jsHeapBytes:heap ? heap.usedJSHeapSize : null,
        wasmBytes:engine.rtenv?.mqWasmBytes?.() ?? null};
    window.mqMetrics.samples.push(sample);
    if(new URLSearchParams(location.search).has('diagnostics')) {
        let label=document.getElementById('mq-diagnostics');
        if(!label){label=document.createElement('div');label.id='mq-diagnostics';label.style='position:fixed;top:0;left:0;z-index:999;color:white;background:#000b;font:12px monospace;pointer-events:none';document.body.append(label);}
        label.textContent='JS '+Math.round((sample.jsHeapBytes||0)/1048576)+' MiB | WASM '+Math.round((sample.wasmBytes||0)/1048576)+' MiB | '+(window.mqMetrics.marks.at(-1)?.stage||'Downloading');
    }
    if(window.mqMetrics.samples.length>3600) window.mqMetrics.samples.shift();
};
window.mqStart = async function(engine, packs, options) {
    window.mqEngine = engine;
    setInterval(()=>window.mqSample(engine),250);
    engine.config.update(options);
    await engine.init('index');
    let done=0;
    const total=packs.reduce((n,p)=>n+p.bytes,0);
    for(const pack of packs) {
        let bytes = new Uint8Array(pack.bytes);
        const response=await fetch(pack.file);
        if(!response.ok) throw new Error('Could not download '+pack.file);
        const reader=response.body.getReader();
        let offset=0;
        for(;;) {
            const {done:ended,value}=await reader.read();
            if(ended)break;
            if(offset+value.length>bytes.length)throw new Error('Pack larger than expected');
            bytes.set(value,offset);offset+=value.length;
            options.onProgress?.(done+offset,total);
        }
        if(offset!==pack.bytes)throw new Error('Incomplete download: '+pack.file);
        window.mqSample(engine);
        engine.copyToFS(pack.file,bytes.buffer);
        bytes=null; // no references kept in a chunks/preload list
        done+=pack.bytes;
        window.mqSample(engine);
        await new Promise(resolve=>requestAnimationFrame(resolve));
    }
    return engine.startGame(options);
};

// The harbor ambience on web (waves, crowd murmur, gulls, the palace bell), made with the browser's Web Audio engine
// like the original browser game (src/sound.js). It runs on the browser's audio thread, so a slow game frame can't
// make it skip; Godot's single-threaded web audio had to be fed every frame and stuttered. harbor_sound.gd drives it.
window.mqHarbor = {
    ctx:null, near:1, muted:false, indoor:false,
    start() {
        if(this.ctx)return;
        const ctx=this.ctx=new AudioContext();
        const noise=(kind)=>{
            const len=ctx.sampleRate*4, buf=ctx.createBuffer(2,len,ctx.sampleRate);
            for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let last=0;
                for(let i=0;i<len;i++){const w=Math.random()*2-1;
                    if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}}
            const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.start();return src;
        };
        this.master=ctx.createGain();this.master.gain.value=0;
        this.muffle=ctx.createBiquadFilter();this.muffle.type='lowpass';this.muffle.frequency.value=20000;
        this.master.connect(this.muffle).connect(ctx.destination);
        const waves=noise('brown');
        const wf=ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=700;
        this.waveGain=ctx.createGain();this.waveGain.gain.value=0.17;
        const swell=ctx.createGain();swell.gain.value=0.6;
        const lfo=ctx.createOscillator();lfo.frequency.value=0.11;
        const lfoAmt=ctx.createGain();lfoAmt.gain.value=0.4;
        lfo.connect(lfoAmt).connect(swell.gain);lfo.start();
        waves.connect(wf).connect(swell).connect(this.waveGain).connect(this.master);
        const crowd=noise('white');
        const cf=ctx.createBiquadFilter();cf.type='bandpass';cf.frequency.value=520;cf.Q.value=1.4;
        this.crowdGain=ctx.createGain();this.crowdGain.gain.value=0.05;
        this.chatter=ctx.createGain();this.chatter.gain.value=1;
        crowd.connect(cf).connect(this.chatter).connect(this.crowdGain).connect(this.master);
        this.nextGull=ctx.currentTime+2;this.nextBell=ctx.currentTime+15;this.nextChatter=0;
        document.addEventListener('visibilitychange',()=>{if(document.hidden)ctx.suspend();else ctx.resume();});
        this.apply();
    },
    // Volume: muted (N / Options), indoors quieter and muffled behind the door (half a second, like the desktop game).
    apply() {
        if(!this.ctx)return;
        const t=this.ctx.currentTime, on=!(this.muted||window.mqSilent);
        this.master.gain.setTargetAtTime(on?0.8*(this.indoor?0.3:1):0,t,0.1);
        this.muffle.frequency.setTargetAtTime(this.indoor?650:20000,t,0.15);
    },
    setMuted(m){this.muted=m;this.apply();},
    setIndoor(i){this.indoor=i;this.apply();},
    update(nearWater,busy) {
        const ctx=this.ctx;if(!ctx)return;
        if(ctx.state==='suspended'&&!document.hidden)ctx.resume().catch(()=>{});
        const t=ctx.currentTime;this.near=nearWater;
        this.waveGain.gain.setTargetAtTime(0.03+0.14*nearWater,t,0.5);
        this.crowdGain.gain.setTargetAtTime(0.008+0.045*busy,t,0.5);
        if(t>this.nextChatter){this.chatter.gain.setTargetAtTime(0.5+Math.random()*0.9,t,0.25);this.nextChatter=t+0.3+Math.random()*0.8;}
        if(t>this.nextGull){this.gull();this.nextGull=t+4+Math.random()*10;}
        if(t>this.nextBell){this.bell();this.nextBell=t+45+Math.random()*40;}
    },
    gull() {
        const ctx=this.ctx,t=ctx.currentTime;
        const pan=ctx.createStereoPanner();pan.pan.value=Math.random()*2-1;
        const out=ctx.createGain();out.gain.value=0.06*this.near;
        pan.connect(out).connect(this.master);
        const calls=2+Math.floor(Math.random()*3);
        for(let i=0;i<calls;i++){
            const s=t+i*0.28,o=ctx.createOscillator();o.type='sawtooth';
            const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=3;
            const g=ctx.createGain(),base=1500+Math.random()*400;
            o.frequency.setValueAtTime(base*1.35,s);o.frequency.exponentialRampToValueAtTime(base,s+0.22);
            g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(1,s+0.03);g.gain.exponentialRampToValueAtTime(0.001,s+0.25);
            o.connect(f).connect(g).connect(pan);o.start(s);o.stop(s+0.3);
        }
    },
    bell() {
        const ctx=this.ctx,t=ctx.currentTime,out=ctx.createGain();out.gain.value=0.07;out.connect(this.master);
        for(const [ratio,amp] of [[1,1],[2.76,0.5],[5.4,0.25],[0.5,0.4]]){
            const o=ctx.createOscillator();o.frequency.value=330*ratio;const g=ctx.createGain();
            g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.001,t+4.5);
            o.connect(g).connect(out);o.start(t);o.stop(t+4.6);
        }
    }
};

for(const kind of ['pointerdown','keydown'])document.addEventListener(kind,()=>{

// Pong on the startup screen (while the game downloads), like the in-game loading screens (scripts/pong_loading.gd):
// "Press E to play"; nobody playing = it just loads. If a game is going when loading finishes, it waits for Enter.
// It takes the place of the Godot logo. The user's idea, 2026-11-11 (docs/todo-next.md 5b).
(function(){
    const W=900,H=340,PW=10,PH=74,R=7,SAND='#e9e5dc',GOLD='#e7c35a';
    let best=0;try{best=+localStorage.getItem('mq-pong-best')||0;}catch(_){}
    const box=document.createElement('div');
    // The game's look (as scripts/web_content.gd): a night sea, the gold Cinzel title, the hand-lettered italic.
    const css=document.createElement('style');
    css.textContent="@font-face{font-family:'MQ Cinzel';src:url(fonts/Cinzel.ttf);font-weight:400 900}@font-face{font-family:'MQ Fell';src:url(fonts/IMFellEnglish-Italic.ttf);font-style:italic}"+
        "#mq-pong progress{appearance:none;-webkit-appearance:none;height:6px;border:0;background:rgba(255,255,255,0.08)}"+
        "#mq-pong progress::-webkit-progress-bar{background:rgba(255,255,255,0.08)}#mq-pong progress::-webkit-progress-value{background:"+GOLD+"}#mq-pong progress::-moz-progress-bar{background:"+GOLD+"}";
    document.head.append(css);
    box.id='mq-pong';
    box.style='position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;pointer-events:none;font-family:"MQ Fell",Georgia,serif;font-style:italic;color:'+SAND+';background:radial-gradient(ellipse 75% 60% at 50% 42%,#131c29,#05080d)';
    const title=document.createElement('div');title.textContent='Merchant Quest';
    title.style='font-family:"MQ Cinzel",Georgia,serif;font-style:normal;font-weight:700;font-size:clamp(30px,5vw,64px);color:'+GOLD+';text-shadow:0 2px 6px rgba(0,0,0,0.6);text-transform:uppercase';
    const note=document.createElement('div');note.textContent='Loading';note.style='font-size:24px;min-height:30px';
    const cv=document.createElement('canvas');cv.style='width:min(900px,90vw);aspect-ratio:900/340;pointer-events:auto;margin-bottom:8vh';
    const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;
    const g=cv.getContext('2d');g.scale(dpr,dpr);
    box.append(title,note,cv);
    let playing=false,waiting=false,done=false,you=H/2,cpu=H/2,bx=W/2,by=H/2,vx=0,vy=0,serve=0,ys=0,cs=0,rally=0,mouse=-1,last=performance.now();
    const keys={};
    const doServe=(dir)=>{bx=W/2;by=H/2;const a=(Math.random()-0.5)*0.9;vx=dir*Math.cos(a)*340;vy=Math.sin(a)*340;serve=0.7;rally=0;};
    const bounce=(py,dir)=>{const off=Math.max(-1,Math.min(1,(by-py)/(PH/2)));const sp=Math.min(Math.hypot(vx,vy)*1.06,820);vx=dir*Math.cos(off*0.9)*sp;vy=Math.sin(off*0.9)*sp;};
    const draw=()=>{
        g.clearRect(0,0,W,H);g.fillStyle='rgba(0,0,0,0.28)';g.fillRect(0,0,W,H);
        g.strokeStyle='rgba(233,229,220,0.25)';g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);
        g.fillStyle='rgba(233,229,220,0.25)';for(let y=8;y+12<=H;y+=22)g.fillRect(W/2-1.5,y,3,12);
        g.fillStyle=SAND;g.fillRect(24,you-PH/2,PW,PH);g.fillRect(W-24-PW,cpu-PH/2,PW,PH);
        g.textAlign='center';
        if(playing){
            g.fillStyle=GOLD;g.beginPath();g.arc(bx,by,R,0,Math.PI*2);g.fill();
            g.fillStyle='rgba(233,229,220,0.8)';g.font='700 34px "MQ Cinzel",Georgia,serif';g.fillText(ys,W/4,44);g.fillText(cs,W*3/4,44);
            g.font='italic 17px "MQ Fell",Georgia,serif';g.fillStyle='rgba(233,229,220,0.7)';g.fillText('Rally '+rally+'  ·  Best '+best,W/2,H-14);
        }else{
            g.fillStyle=GOLD;g.font='700 30px "MQ Cinzel",Georgia,serif';g.fillText('Press E to play Pong',W/2,H/2-4);
            g.font='italic 18px "MQ Fell",Georgia,serif';g.fillStyle='rgba(233,229,220,0.75)';
            g.fillText('W / S or the arrow keys move your paddle'+(best>0?'  ·  Best rally '+best:''),W/2,H/2+30);
        }
    };
    const finish=()=>{box.remove();window.removeEventListener('keydown',onKey,true);window.removeEventListener('keyup',onUp,true);};

        if(!box.isConnected)return;

        const notice=document.getElementById('status-notice');

            box.style.pointerEvents='auto';
        }
        if(playing){
            const k=(keys.KeyW||keys.ArrowUp?-1:0)+(keys.KeyS||keys.ArrowDown?1:0);
            if(k){mouse=-1;you+=k*460*dt;}else if(mouse>=0){you+=Math.max(-736*dt,Math.min(736*dt,mouse-you));}
            you=Math.max(PH/2,Math.min(H-PH/2,you));
            const aim=vx>0?by:H/2;cpu+=Math.max(-300*dt,Math.min(300*dt,aim-cpu));cpu=Math.max(PH/2,Math.min(H-PH/2,cpu));
            if(serve>0)serve-=dt;else{
                // Small steps (at most 4 px each), so a fast ball can't jump clean over a paddle between checks.
                const n=Math.max(1,Math.ceil(Math.hypot(vx,vy)*dt/4));
                for(let i=0;i<n;i++){const h=dt/n;
                bx+=vx*h;by+=vy*h;
                if(by<R){by=R;vy=Math.abs(vy);}else if(by>H-R){by=H-R;vy=-Math.abs(vy);}
                if(vx<0&&bx-R<=24+PW&&bx+R>=24&&Math.abs(by-you)<=PH/2+R){bounce(you,1);bx=24+PW+R;rally++;
                    if(rally>best){best=rally;try{localStorage.setItem('mq-pong-best',best);}catch(_){}}}
                else if(vx>0&&bx+R>=W-24-PW&&bx-R<=W-24&&Math.abs(by-cpu)<=PH/2+R){bounce(cpu,-1);bx=W-24-PW-R;}
                }

        if(e.code==='KeyE'&&!playing){playing=true;ys=cs=0;you=cpu=H/2;doServe(Math.random()<0.5?1:-1);}
        else if((e.code==='Enter'||e.code==='NumpadEnter')&&waiting){finish();return;}

        const splash=document.getElementById('status-splash');if(splash)splash.style.display='none';
        const status=document.getElementById('status');if(status)status.style.backgroundColor='#05080d';
        const bar=document.getElementById('status-progress');   // the download bar sits between the words and the court
        if(bar&&status){bar.style.position='static';bar.style.width='min(900px,90vw)';box.insertBefore(bar,cv);}
        if(!status)return;   // already started (or a failure page): no Pong
        document.body.append(box);window.addEventListener('keydown',onKey,true);window.addEventListener('keyup',onUp,true);
        draw();requestAnimationFrame(tick);
    };
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');

			statusNotice.appendChild(document.createTextNode(line));

		console.error(err);
